name: Image

# A tag publishes the image under that tag. The manual run publishes what the branch
# holds, under the branch name, which is how a pre-release image gets onto a cluster.
# release.yaml calls this with a version as well: a tag pushed by its GITHUB_TOKEN starts
# no workflow, so it publishes the image itself, from the commit it is about to tag,
# before the tag exists. ci.yaml calls it with main once the checks pass on a push to
# main, which keeps :main on the latest commit (ADR 0011).
#
# A pull request builds the image without pushing it, so that an update Renovate merges
# by itself (a base image, the Go toolchain) is known to still build for both
# architectures. Only the publishing job holds the package write permission. A called run
# always publishes, even when the caller runs on a pull request (release.yaml on the
# merge of a vuln-responder/ branch): the version input is what tells them apart.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The tag to publish the image as (v1.2.3, or main).
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' && inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The daemon is cross-compiled, but the arm64 half of the image installs
      # packages for that architecture, so the runner needs the emulator.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: make image IMAGE=cnidaria-cni:test

  # In a called run, github.event_name is the caller's (schedule, workflow_dispatch,
  # push or pull_request), so this is decided by the version input too.
  push:
    if: github.event_name != 'pull_request' || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Through the Makefile, so that the architectures and the labels are decided in
      # one place.
      - name: Build and push
        run: make image IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.version || github.ref_name }} PUSH=1
