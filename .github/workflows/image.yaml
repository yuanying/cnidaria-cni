name: Image

# A tag publishes the image under that tag. The manual run publishes what the branch
# holds, under the branch name, which is how a pre-release image gets onto a cluster.
# release.yaml calls this with a version as well: a tag pushed by its GITHUB_TOKEN starts
# no workflow, so it publishes the image itself, from the commit it is about to tag,
# before the tag exists.
#
# A pull request builds the image without pushing it, so that an update Renovate merges
# by itself (a base image, the Go toolchain) is known to still build for both
# architectures. Only the publishing job holds the package write permission.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to publish the image as (v1.2.3).
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The daemon is cross-compiled, but the arm64 half of the image installs
      # packages for that architecture, so the runner needs the emulator.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: make image IMAGE=cnidaria-cni:test

  # In a called run, github.event_name is the caller's (schedule or workflow_dispatch),
  # so this runs for release.yaml too.
  push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Through the Makefile, so that the architectures are decided in one place.
      - name: Build and push
        run: make image IMAGE=ghcr.io/${{ github.repository }}:${{ inputs.version || github.ref_name }} PUSH=1
