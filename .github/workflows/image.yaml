name: Image

# A tag publishes the image under that tag. The manual run publishes what the branch
# holds, under the branch name, which is how a pre-release image gets onto a cluster.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The daemon is cross-compiled, but the arm64 half of the image installs
      # packages for that architecture, so the runner needs the emulator.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Through the Makefile, so that the architectures are decided in one place.
      - name: Build and push
        run: make image IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }} PUSH=1
