# Deployment manifests for cnidaria-cni: the NodeNetworkPolicy CRD, RBAC and the DaemonSet.
# `kubectl kustomize deploy` renders them; `kubectl apply -k deploy` installs them.
# The CRD under crd/ is generated by `make generate` and committed, so nothing here
# needs a code generator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - crd/cnidaria.unstable.cloud_nodenetworkpolicies.yaml
  - rbac.yaml
  - daemonset.yaml
# The tag to deploy. Overriding it is the one edit an installation is expected to
# make, in an overlay or here; the default is the release these manifests belong to.
# The Makefile's IMAGE defaults to :dev instead, so a local build never takes a
# release's tag.
images:
  - name: ghcr.io/yuanying/cnidaria-cni
    newTag: v0.1.0
