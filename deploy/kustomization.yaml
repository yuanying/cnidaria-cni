# Deployment manifests for cnidaria-cni: DaemonSet, RBAC and the NodePolicy CRD.
# The resources are added by the unit that implements them; the CRD under crd/ is
# generated by `make generate`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - crd/cnidaria.unstable.cloud_nodepolicies.yaml
