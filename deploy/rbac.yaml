# What the daemon is allowed to read and write. It watches the objects it renders and
# writes nothing back except NodePolicy status, so every rule here is read-only apart
# from that one (ADR 0004, ADR 0007).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
rules:
  # Nodes carry the podCIDRs the conflist and the routes are built from, and the
  # InternalIP that is a route's next hop (ADR 0005, ADR 0006).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # A NetworkPolicy peer may name a pod or a namespace anywhere in the cluster, so
  # every node reads all of them.
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [cnidaria.unstable.cloud]
    resources: [nodepolicies]
    verbs: [get, list, watch]
  # A NodePolicy is cluster-scoped and every selected node reports back into its own
  # entry of status.nodes, through the status subresource so the writes do not collide.
  - apiGroups: [cnidaria.unstable.cloud]
    resources: [nodepolicies/status]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnidaria
subjects:
  - kind: ServiceAccount
    name: cnidaria
    namespace: kube-system
