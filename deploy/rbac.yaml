# What the daemon is allowed to read and write. It watches the objects it renders and
# writes nothing back except NodeNetworkPolicy status and one annotation on its own
# Node, so every rule here is read-only apart from those two (ADR 0004, ADR 0006,
# ADR 0007).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
rules:
  # Nodes carry the podCIDRs the conflist and the routes are built from, and the
  # InternalIP that is a route's next hop (ADR 0005, ADR 0006). A node without an
  # IPv6 InternalIP patches its global IPv6 address into an annotation on its own
  # Node for its peers to route through; RBAC cannot narrow that to the node's own
  # object, since every copy of the daemon shares this role.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  # A NetworkPolicy peer may name a pod or a namespace anywhere in the cluster, so
  # every node reads all of them.
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [cnidaria.unstable.cloud]
    resources: [nodenetworkpolicies]
    verbs: [get, list, watch]
  # A NodeNetworkPolicy is cluster-scoped and every selected node reports back into its own
  # entry of status.nodes, through the status subresource so the writes do not collide.
  - apiGroups: [cnidaria.unstable.cloud]
    resources: [nodenetworkpolicies/status]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnidaria
  labels:
    app.kubernetes.io/name: cnidaria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnidaria
subjects:
  - kind: ServiceAccount
    name: cnidaria
    namespace: kube-system
